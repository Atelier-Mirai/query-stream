# Ruby 3.4 と 4.0 の両方でテストを走らせる。
#
# 両方を回すのが要点である。`it`（暗黙ブロック引数）は Ruby 3.3 以下でも
# 構文エラーにならず「it というメソッドの呼び出し」として通り、実行時に
# NameError になる——静的解析では捕まらない類の非互換なので、
# 対応を謳うバージョンで実際に走らせる以外に確かめる方法がない。
name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rake test
